version: "3.8"

x-auth-env: &auth-env
  Security__AuthorizationEnabled: ${AUTHORIZATION_ENABLED:-true}
  Jwt__Issuer: ${JWT_ISSUER:-latee-auth}
  Jwt__Audience: ${JWT_AUDIENCE:-latee-clients}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-latee_super_secret_signing_key_2026_change_me}
  Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-1440}
  Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}

services:

  mysql:
    image: mysql:8.0
    container_name: latee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: latee
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - latee-network

  clinicalcase:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ClinicalCase
    container_name: clinicalcase-api
    ports:
      - "8001:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClinicalCaseDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    networks:
      - latee-network

  assessment:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Assessment
    container_name: assessment-api
    ports:
      - "8004:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AssessmentDb: "Server=latee-mysql;Port=3306;Database=latee;Uid=user;Pwd=pass;AllowPublicKeyRetrieval=True"
      GeminiAi__ApiKey: ${GEMINI_15_API_KEY}
      <<: *auth-env
    env_file:
      - ../.env
    networks:
      - latee-network

  virtualpatient:
    build:
      context: ..
      dockerfile: docker/Dockerfile.VirtualPatient
    container_name: virtualpatient-api
    ports:
      - "8002:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__VirtualPatientDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    networks:
      - latee-network

  # =========================================================
  # VIRTUAL PATIENT AI (Llama 3.1 + Adapter)
  # =========================================================

  virtualpatient-python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.VirtualPatient.Python
    container_name: vp-python-api
    ports:
      - "8005:8080"
    depends_on:
      ollama-warmup-vp:
        condition: service_completed_successfully
      virtualpatient:
        condition: service_started
    environment:
      OLLAMA_URL: "http://ollama-vp:11434"
      OLLAMA_MODEL: "virtual-patient-model"
      VIRTUAL_PATIENT_API_URL: "http://virtualpatient:8080/api/virtual-patients"
    networks:
      - latee-network

  ollama-vp:
    image: ollama/ollama:latest
    container_name: ollama-vp
    ports:
      - "11435:11434"
    volumes:
      - ollama_vp_data:/root/.ollama
      - ./Llama-3.1-Virtual-Patient-MimicIV_Ver2.0:/root/.ollama/adapters_setup:ro
      - ./ollama_vp_setup:/root/.ollama/setup:ro
    networks:
      - latee-network
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-warmup-vp:
    image: ollama/ollama:latest
    container_name: ollama-warmup-vp
    depends_on:
      ollama-vp:
        condition: service_started
    volumes:
      - ollama_vp_data:/root/.ollama
      - ./Llama-3.1-Virtual-Patient-MimicIV_Ver2.0:/root/.ollama/adapters_setup:ro
      - ./ollama_vp_setup:/root/.ollama/setup:ro
    environment:
      - OLLAMA_HOST=http://ollama-vp:11434
    entrypoint: [ "/bin/sh" ]
    command:
      - "-c"
      - |
        echo "Waiting for Ollama API..."
        until ollama list > /dev/null 2>&1; do sleep 2; done

        # Kiểm tra nếu chưa có base model thì mới pull
        if ! ollama list | grep -q "llama3.1:8b"; then
          echo "Pulling Llama 3.1 8B..."
          ollama pull llama3.1:8b
        else
          echo "Base model already exists. Skipping pull."
        fi

        echo "Applying adapter via Modelfile..."
        ollama create virtual-patient-model -f /root/.ollama/setup/Modelfile.VP
        echo "Warmup Done Successfully!"
    restart: "no"
    networks:
      - latee-network

  # =========================================================
  # AI Assistant, Gateway, Redis...
  # =========================================================

  ai-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.AIAssistant
    container_name: ai-assistant-api
    ports:
      - "8003:8000"
    environment:
      EMBEDDING_MODEL: "jinaai/jina-embeddings-v2-small-en"
      FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
    volumes:
      - ../src/Services/AIAssistantService/python_api/data:/src/data:ro
      - ../src/Services/AIAssistantService/python_api:/src
      - ai_assistant_faiss:/src/faiss_index
    env_file:
      - ../.env
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: rebuild
          path: ../src/Services/AIAssistantService/python_api
    networks:
      - latee-network

  roadmap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Roadmap
      target: dev
    container_name: roadmap-api
    ports:
      - "8006:8080"
    env_file:
      - ../.env
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__RoadmapDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    command: dotnet watch --project src/Services/RoadmapService/RoadmapService.API/RoadmapService.API.csproj run --no-launch-profile --urls http://0.0.0.0:8080
    volumes:
      - ../src:/src/src
      - roadmap_nuget_cache:/root/.nuget/packages
    networks:
      - latee-network

  knowledgeresource:
    build:
      context: ..
      dockerfile: docker/Dockerfile.KnowledgeResource
      target: dev
    container_name: knowledgeresource-api
    ports:
      - "8009:8080"
    env_file:
      - ../.env
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__KnowledgeResourceDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    command: dotnet watch --project src/Services/KnowledgeResourceService/KnowledgeResourceService.API/KnowledgeResourceService.API.csproj run --no-launch-profile --urls http://0.0.0.0:8080
    volumes:
      - ../src:/src/src
      - knowledge_nuget_cache:/root/.nuget/knowledge_packages
    networks:
      - latee-network

  user:
    build:
      context: ..
      dockerfile: docker/Dockerfile.UserService
      target: dev
    container_name: user-api
    ports:
      - "8010:8080"
    env_file:
      - ../.env
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_MSBUILD_INCREMENTALISM: "1"
      ConnectionStrings__UserDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    command: dotnet watch --project src/Services/UserService/UserService.API/UserService.API.csproj
      run --no-launch-profile --urls http://0.0.0.0:8080
      --exclude **/bin/**
      --exclude **/obj/**
    volumes:
      - ../src:/src/src
      - user_nuget_cache:/root/.nuget/user_packages
    networks:
      - latee-network

  evaluation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Evaluation
    container_name: evaluation-api
    ports:
      - "8008:8080"
    env_file:
      - ../.env
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__EvaluationDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    networks:
      - latee-network

  practice-session:
    build:
      context: ..
      dockerfile: docker/Dockerfile.PracticeSession
    container_name: practice-session-api
    ports:
      - "8007:8080"
    env_file:
      - ../.env
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PracticeSessionDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    networks:
      - latee-network

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.APIGateway
    container_name: api-gateway
    ports:
      - "5000:8080"
    volumes:
      - ../src/Gateway/ApiGateway/ocelot.json:/app/ocelot.json:ro
      - ../src/Gateway/ApiGateway/ocelot.auth.json:/app/ocelot.auth.json:ro
      - ../src/Gateway/ApiGateway/ocelot.noauth.json:/app/ocelot.noauth.json:ro
    depends_on:
      - clinicalcase
      - virtualpatient
      - ai-assistant
      - assessment
      - roadmap
      - evaluation
      - practice-session
      - user
      - knowledgeresource
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: "Server=latee-mysql;Port=3306;Database=latee;User=user;Password=pass;"
      <<: *auth-env
    networks:
      - latee-network

volumes:
  mysql_data:
  ollama_data:
  ollama_vp_data:
  ai_assistant_faiss:
  roadmap_nuget_cache:
  knowledge_nuget_cache:
  user_nuget_cache:
    
networks:
  latee-network:
    driver: bridge