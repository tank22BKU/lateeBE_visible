services:
  mysql:
    image: mysql:8.0
    container_name: latee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: latee
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - latee-network

  clinicalcase:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ClinicalCase
    container_name: clinicalcase-api
    ports:
      - "8001:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClinicalCaseDb: "Server=mysql;Port=3306;Database=latee;User=user;Password=pass;"
    networks:
      - latee-network

  # Base Service Virtual Patient 
  virtualpatient:
    build:
      context: ..
      dockerfile: docker/Dockerfile.VirtualPatient
    container_name: virtualpatient-api
    ports:
      - "8002:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__VirtualPatientDb: "Server=mysql;Port=3306;Database=latee;User=user;Password=pass;"
    networks:
      - latee-network

  # =========================================================
  # VIRTUAL PATIENT AI (Llama 3.1 + Adapter)
  # =========================================================

  # 1. API VIRTUAL PATIENT 
  virtualpatient-python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.VirtualPatient.Python
    container_name: vp-python-api
    ports:
      - "8005:8080" # Expose another port 8005
    depends_on:
      ollama-warmup-vp:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: "http://ollama-vp:11434"
      OLLAMA_MODEL: "virtual-patient-model"
    networks:
      - latee-network

  # 2. INIT ADAPTER VP CONTAINER: Automatically download llama.cpp and convert Adapter HuggingFace to GGUF.
  init-adapter-vp:
    image: python:3.12-slim
    container_name: init-adapter-vp
    volumes:
      - ./Llama-3.1-Virtual-Patient-MimicIV_Ver2.0:/app/hf_adapter:ro
      - ./ollama_vp_setup:/app/ollama_setup
    command: >
      bash -c "
      if [ ! -f /app/ollama_setup/vp_adapter.gguf ]; then
        echo '--- Start setting up the adapter for the Virtual Patient. ---';
        apt-get update && apt-get install -y git;
        git clone https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp;
        pip install -r /tmp/llama.cpp/requirements.txt;
        
        echo 'Converting adapter to GGUF...';
        python /tmp/llama.cpp/convert_lora_to_gguf.py /app/hf_adapter --outtype f16 --outfile /app/ollama_setup/vp_adapter.gguf;
        
        echo 'Create a Modelfile...';
        echo 'FROM llama3.1:8b' > /app/ollama_setup/Modelfile.VP;
        echo 'ADAPTER /root/.ollama/adapters_setup/vp_adapter.gguf' >> /app/ollama_setup/Modelfile.VP;
        echo 'PARAMETER temperature 0.1' >> /app/ollama_setup/Modelfile.VP;
        echo 'PARAMETER top_p 0.9' >> /app/ollama_setup/Modelfile.VP;
        echo '--- Done ---';
      else
        echo 'vp_adapter.gguf is ready, skip the conversion step...';
      fi
      "
    networks:
      - latee-network

  # 3. OLLAMA-VP ENGINE - Independent Instruction Specific to the Virtual Patient
  ollama-vp:
    image: ollama/ollama:latest
    container_name: ollama-vp
    ports:
      - "11435:11434" # Another Port 11435
    volumes:
      - ollama_vp_data:/root/.ollama
      - ./ollama_vp_setup:/root/.ollama/adapters_setup
    networks:
      - latee-network
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # 4. WARMUP: Integrate Ollama GGUF into the Base Model
  ollama-warmup-vp:
    image: ollama/ollama:latest
    container_name: ollama-warmup-vp
    depends_on:
      ollama-vp:
        condition: service_started
      init-adapter-vp:
        condition: service_completed_successfully
    volumes:
      - ./ollama_vp_setup:/root/.ollama/adapters_setup
    environment:
      - OLLAMA_HOST=http://ollama-vp:11434
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      echo 'Pull Base Model Llama 3.1 8B...' &&
      ollama pull llama3.1:8b && 
      echo 'Create a virtual patient model (virtual-patient-model)...' &&
      ollama create virtual-patient-model -f /root/.ollama/adapters_setup/Modelfile.VP &&
      echo 'Done!'
    restart: "no"
    networks:
      - latee-network

  # =========================================================
  # (AI Assistant, Gateway, Redis...)
  # =========================================================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - latee-network
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_GPU=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_THREAD=4
      - OLLAMA_NUM_CTX=4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-warmup:
    image: ollama/ollama:latest
    container_name: ollama-warmup
    depends_on:
      ollama:
        condition: service_started
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      ollama pull llama3.1-8b 
    restart: "no"
    networks:
      - latee-network

  ai-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.AIAssistant
    container_name: ai-assistant-api
    ports:
      - "8003:8000"
    volumes:
      - ../src/Services/AIAssistantService/python_api/data:/src/data:ro
    env_file:
      - ../.env
    depends_on:
      ollama:
        condition: service_started
      ollama-warmup:
        condition: service_completed_successfully
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: rebuild
          path: ../src/Services/AIAssistantService/python_api
    networks:
      - latee-network

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.APIGateway
    container_name: api-gateway
    ports:
      - "5000:8080"
    volumes:
      - ../src/Gateway/ApiGateway/ocelot.json:/app/ocelot.json:ro
    depends_on:
      - clinicalcase
      - virtualpatient
      - ai-assistant
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - latee-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - latee-network

volumes:
  mysql_data:
  ollama_data:
  ollama_vp_data: 

networks:
  latee-network:
    driver: bridge