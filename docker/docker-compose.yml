  ai-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.AIAssistant
    container_name: ai-assistant-api
    ports:
      - "8003:8000"
    volumes:
      - ../src/Services/AIAssistantService/python_api/data:/src/data:ro
      - ../src/Services/AIAssistantService/python_api:/src
    env_file:
      - ../.env
#    depends_on:
#      ollama:
#        condition: service_started
#      ollama-warmup:
#        condition: service_completed_successfully
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: rebuild
          path: ../src/Services/AIAssistantService/python_api
    networks:
      - latee-network

  roadmap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Roadmap
    container_name: roadmap-api
    ports:
      - "8006:8080"
    env_file:
      - ../.env
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RoadmapDb: "Server=mysql;Port=3306;Database=latee;User=user;Password=pass;"
    networks:
      - latee-network

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.APIGateway
    container_name: api-gateway
    ports:
      - "5000:8080"
    volumes:
      - ../src/Gateway/ApiGateway/ocelot.json:/app/ocelot.json:ro
    depends_on:
      - clinicalcase
      - virtualpatient
      - ai-assistant
      - assessment
      - roadmap
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - latee-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - latee-network

volumes:
  mysql_data:
  ollama_data:
  ollama_vp_data: 

networks:
  latee-network:
    driver: bridge
