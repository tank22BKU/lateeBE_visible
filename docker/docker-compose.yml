services:
  mysql:
    image: mysql:8.0
    container_name: latee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: latee
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - latee-network

  clinicalcase:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ClinicalCase
    container_name: clinicalcase-api
    ports:
      - "8001:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClinicalCaseDb: "Server=mysql;Port=3306;Database=latee;User=user;Password=pass;"
    networks:
      - latee-network

  # Base Service Virtual Patient 
  virtualpatient:
    build:
      context: ..
      dockerfile: docker/Dockerfile.VirtualPatient
    container_name: virtualpatient-api
    ports:
      - "8002:8080"
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__VirtualPatientDb: "Server=mysql;Port=3306;Database=latee;User=user;Password=pass;"
    networks:
      - latee-network

  # =========================================================
  # VIRTUAL PATIENT AI (Llama 3.1 + Adapter)
  # =========================================================

  # 1. API VIRTUAL PATIENT 
  virtualpatient-python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.VirtualPatient.Python
    container_name: vp-python-api
    ports:
      - "8005:8080" 
    depends_on:
      ollama-warmup-vp:
        condition: service_completed_successfully
      virtualpatient:
        condition: service_started
    environment:
      OLLAMA_URL: "http://ollama-vp:11434"
      OLLAMA_MODEL: "virtual-patient-model"
      VIRTUAL_PATIENT_API_URL: "http://virtualpatient:8080/api/virtual-patients"
    networks:
      - latee-network

  # 2. OLLAMA-VP ENGINE
  ollama-vp:
    image: ollama/ollama:latest
    container_name: ollama-vp
    ports:
      - "11435:11434" 
    volumes:
      - ollama_vp_data:/root/.ollama
      - ./Llama-3.1-Virtual-Patient-MimicIV_Ver2.0:/root/.ollama/adapters_setup:ro
      - ./ollama_vp_setup:/root/.ollama/setup:ro
    networks:
      - latee-network
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1 
      - OLLAMA_MAX_LOADED_MODELS=1 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # 3. WARMUP: Tạo Model 
  ollama-warmup-vp:
    image: ollama/ollama:latest
    container_name: ollama-warmup-vp
    depends_on:
      ollama-vp:
        condition: service_started
    volumes:
      - ./Llama-3.1-Virtual-Patient-MimicIV_Ver2.0:/root/.ollama/adapters_setup:ro
      - ./ollama_vp_setup:/root/.ollama/setup:ro
    environment:
      - OLLAMA_HOST=http://ollama-vp:11434
    entrypoint: [ "/bin/sh" ]
    command: 
      - "-c"
      - |
        echo "Waiting 15s for Ollama API to be ready..."
        sleep 15
        echo "Pull Base Model Llama 3.1 8B..."
        ollama pull llama3.1:8b
        echo "Create a virtual patient model using existing Modelfile.VP..."
        ollama create virtual-patient-model -f /root/.ollama/setup/Modelfile.VP
        echo "Warmup Done Successfully!"
    restart: "no"
    networks:
      - latee-network

  # =========================================================
  # AI Assistant, Gateway, Redis...
  # =========================================================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - latee-network
    environment:
      - OLLAMA_NUM_PARALLEL=1 
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=15m 
      - OLLAMA_NUM_CTX=4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-warmup:
    image: ollama/ollama:latest
    container_name: ollama-warmup
    depends_on:
      ollama:
        condition: service_started
    entrypoint: [ "/bin/sh" ]
    command: 
      - "-c"
      - |
        echo "Waiting 15s for Ollama API to be ready..."
        sleep 15
        echo "Pull Base Model Llama 3.1 8B..."
        ollama pull llama3.1:8b
        echo "Warmup Done Successfully!"
    restart: "no"
    networks:
      - latee-network

  ai-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.AIAssistant
    container_name: ai-assistant-api
    ports:
      - "8003:8000"
    volumes:
      - ../src/Services/AIAssistantService/python_api/data:/src/data:ro
    env_file:
      - ../.env
    depends_on:
      ollama:
        condition: service_started
      ollama-warmup:
        condition: service_completed_successfully
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: rebuild
          path: ../src/Services/AIAssistantService/python_api
    networks:
      - latee-network

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.APIGateway
    container_name: api-gateway
    ports:
      - "5000:8080"
    volumes:
      - ../src/Gateway/ApiGateway/ocelot.json:/app/ocelot.json:ro
    depends_on:
      - clinicalcase
      - virtualpatient
      - ai-assistant
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - latee-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - latee-network

volumes:
  mysql_data:
  ollama_data:
  ollama_vp_data: 

networks:
  latee-network:
    driver: bridge